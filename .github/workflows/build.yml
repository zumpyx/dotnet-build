name: Build .NET Tools

on:
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - config.json
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: dotnet-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Toolchain ─────────────────────────────────────────────────────────
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            9.0.x

      # ── Build all enabled tools ───────────────────────────────────────────
      - name: Build tools
        id: build_tools
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/build.ps1

      # ── Publish artifacts + status ────────────────────────────────────────
      - name: Publish artifacts
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/publish.ps1
