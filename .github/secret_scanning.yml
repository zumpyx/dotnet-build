# Secret scanning exclusions for dotnet-build.
#
# The NET4.8 branch stores compiled build artifacts (obfuscated .NET binaries).
# These binaries regularly trip secret-scanning heuristics with false positives
# (e.g. Dotfuscator-obfuscated winPEAS *_ofs.exe files), which blocks the
# automated artifacts push. Build outputs are not secrets.
paths-ignore:
  - "**/*.exe"
